[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "watermarking-lab"
version = "0.1.0"
description = "Reproducible CPU-keyed Kirchenbauer watermarking experiments on Apple silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
  "datasets>=3,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nltk>=3.9,<4"]

[project.scripts]
watermark-lab = "watermarking.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/watermarking"]
